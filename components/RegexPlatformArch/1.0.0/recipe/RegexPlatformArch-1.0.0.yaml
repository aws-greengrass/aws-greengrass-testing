---
RecipeFormatVersion: "2020-01-25"
ComponentName: _RegexPlatformArch_
ComponentVersion: "1.0.0"
ComponentDescription: Tests regex alternation in platform architecture matching
ComponentPublisher: GG UAT
Manifests:
  - Platform:
      architecture: "/aarch64|amd64/"
      os: "linux"
      runtime: "*"
    Lifecycle:
      run: echo REGEX_ARCH_SELECTED
  - Platform:
      os: "*"
      runtime: "*"
    Lifecycle:
      run: echo REGEX_ARCH_FALLBACK
