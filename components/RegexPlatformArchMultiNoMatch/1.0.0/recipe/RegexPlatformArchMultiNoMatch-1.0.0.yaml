---
RecipeFormatVersion: "2020-01-25"
ComponentName: _RegexPlatformArchMultiNoMatch_
ComponentVersion: "1.0.0"
ComponentDescription:
  Tests five-branch regex where no branch matches the device architecture
ComponentPublisher: GG UAT
Manifests:
  - Platform:
      architecture: "/riscv64|x86|arm/"
      os: "linux"
      runtime: "*"
    Lifecycle:
      run: echo REGEX_ARCH_MULTI_NOMATCH_VIOLATION
  - Platform:
      architecture: "/aarch64|amd64/"
      os: "linux"
      runtime: "*"
    Lifecycle:
      run: echo REGEX_ARCH_MULTI_NOMATCH_FALLBACK
