---
RecipeFormatVersion: "2020-01-25"
ComponentName: _RegexPlatformArchMulti_
ComponentVersion: "1.0.0"
ComponentDescription:
  Tests five-branch regex alternation in platform architecture matching
ComponentPublisher: GG UAT
Manifests:
  - Platform:
      architecture: "/riscv64|x86|aarch64|amd64|arm/"
      os: "linux"
      runtime: "*"
    Lifecycle:
      run: echo REGEX_ARCH_MULTI_SELECTED
  - Platform:
      os: "*"
      runtime: "*"
    Lifecycle:
      run: echo REGEX_ARCH_MULTI_FALLBACK
